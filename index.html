<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuel KM Manager</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f4f8;
color:#172033
}

header{
background:#0866d6;
color:white;
padding:18px;
text-align:center
}

header h1{margin:0;font-size:23px}
header p{margin:6px 0 0;font-size:13px}

.container{
max-width:850px;
margin:auto;
padding:15px
}

.card{
background:white;
padding:18px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}

h2{
margin-top:0;
color:#0866d6;
font-size:19px
}

label{
display:block;
font-weight:bold;
margin:12px 0 6px
}

input{
width:100%;
padding:13px;
border:1px solid #ccd4df;
border-radius:9px;
font-size:16px
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:0;
border-radius:9px;
font-size:16px;
font-weight:bold
}

.blue{background:#0866d6;color:white}
.green{background:#159447;color:white}
.orange{background:#e89100;color:white}
.red{background:#d93636;color:white}
.gray{background:#667085;color:white}
.purple{background:#6845c5;color:white}

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat{
background:#eef5ff;
padding:15px;
border-radius:12px;
text-align:center
}

.stat span{
display:block;
font-size:13px
}

.stat strong{
display:block;
font-size:19px;
margin-top:7px;
color:#0866d6
}

.expense{
background:#fff0f0
}

.expense strong{
color:#d93636
}

.remaining{
background:#eaf8ee
}

.remaining strong{
color:#159447
}

.km{
background:#f1edff
}

.km strong{
color:#6645b5
}

.warning{
background:#fff4d6;
color:#8a5a00;
padding:13px;
border-radius:10px;
margin-top:12px;
font-weight:bold
}

.danger{
background:#ffe5e5;
color:#a40000;
padding:13px;
border-radius:10px;
margin-top:12px;
font-weight:bold
}

.vehicle{
border:1px solid #ddd;
padding:15px;
border-radius:12px;
margin-bottom:12px
}

.vehicle h3{
margin:0 0 12px;
color:#0866d6
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}

.box{
background:#f5f7fa;
padding:10px;
border-radius:8px;
text-align:center
}

.box b{
display:block;
margin-top:4px
}

.log{
border-top:1px solid #ddd;
padding:14px 0;
line-height:1.8
}

.log:first-child{
border-top:0
}

.plate{
font-size:18px;
font-weight:bold;
color:#0866d6
}

.archive{
background:#f4efff;
border-left:5px solid #6845c5;
padding:14px;
border-radius:9px;
margin-bottom:10px
}

.progress{
height:14px;
background:#e2e6eb;
border-radius:20px;
overflow:hidden;
margin-top:8px
}

.progress div{
height:100%;
width:0%;
background:#0866d6
}

.small{
font-size:13px;
color:#687386
}

footer{
text-align:center;
padding:20px;
font-size:12px;
color:#777
}

@media(max-width:600px){
.dashboard,.grid{
grid-template-columns:1fr 1fr
}
}

@media print{
button,input{
display:none!important
}

body{
background:white
}

.card{
box-shadow:none;
border:1px solid #ddd
}
}
</style>
</head>

<body>

<header>
<h1>⛽ Fuel & KM Manager</h1>
<p>15-Day Fuel • Budget • Kilometer Management</p>
</header>

<div class="container">

<!-- PERIOD -->

<div class="card">

<h2>📅 15-Day Period</h2>

<label>መጀመሪያ ቀን</label>
<input type="date" id="startDate">

<label>መጨረሻ ቀን</label>
<input type="date" id="endDate">

<button class="blue" onclick="savePeriod()">
💾 Period አስቀምጥ
</button>

<div id="periodBox" class="small">
Period አልተመዘገበም።
</div>

</div>


<!-- DASHBOARD -->

<div class="card">

<h2>📊 Dashboard</h2>

<div class="dashboard">

<div class="stat">
<span>🚗 መኪና</
