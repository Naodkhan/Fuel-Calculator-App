<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15-Day Fuel & KM Manager</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#17202a;
}

header{
  background:#1261a0;
  color:white;
  padding:18px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:23px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 14px;
  color:#1261a0;
  font-size:19px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
  font-size:13px;
}

input,select,button{
  width:100%;
  padding:11px;
  border:1px solid #ccd5df;
  border-radius:7px;
  font-size:14px;
}

button{
  background:#1261a0;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

.btn-danger{background:#c0392b}
.btn-green{background:#168a45}
.btn-gray{background:#6c757d}
.btn-orange{background:#d68910}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:white;
  border-radius:10px;
  padding:15px;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
}

.stat strong{
  display:block;
  font-size:23px;
  color:#1261a0;
  margin-top:5px;
}

.stat span{
  font-size:13px;
  color:#667;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  text-align:left;
  font-size:13px;
}

th{
  background:#1261a0;
  color:white;
}

tr:nth-child(even){
  background:#f8fafc;
}

.small{
  font-size:12px;
  color:#667;
}

.summary-box{
  background:#eef6ff;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
}

.report-head{
  text-align:center;
  border-bottom:2px solid #1261a0;
  padding-bottom:12px;
  margin-bottom:15px;
}

.report-head h2{
  margin:0;
  color:#1261a0;
}

.report-head p{
  margin:5px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
}

.badge-green{
  background:#d9f7e5;
  color:#16753b;
}

.badge-red{
  background:#ffe0dd;
  color:#a72a20;
}

.badge-orange{
  background:#fff0d5;
  color:#98600b;
}

.hidden{
  display:none;
}

.notice{
  background:#fff7df;
  border-left:5px solid #e0a400;
  padding:10px;
  margin-bottom:12px;
  font-size:13px;
}

canvas{
  width:100%;
  max-height:300px;
}

@media(max-width:700px){
  .grid,
  .grid3,
  .dashboard,
  .actions{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:20px;
  }

  .container{
    padding:9px;
  }

  .card{
    padding:12px;
  }
}

@media print{
  header,
  .no-print,
  button,
  input,
  select{
    display:none!important;
  }

  body{
    background:white;
  }

  .card{
    box-shadow:none;
    border:1px solid #ddd;
  }

  .container{
    max-width:none;
  }

  table{
    min-width:0;
  }
}
</style>
</head>

<body>

<header>
  <h1>⛽ 15-Day Fuel & KM Manager</h1>
  <p>Fuel • Budget • Vehicle • Driver • Kilometer Management</p>
</header>

<div class="container">

<!-- PERIOD -->
<div class="card no-print">
<h2>📅 15-Day Period</h2>

<div class="grid">
  <div>
    <label>Start Date</label>
    <input type="date" id="periodStart">
  </div>

  <div>
    <label>End Date</label>
    <input type="date" id="periodEnd">
  </div>
</div>

<div class="actions">
  <button onclick="savePeriod()">Save Period</button>
  <button class="btn-orange" onclick="newPeriod()">Archive & New Period</button>
  <button class="btn-gray" onclick="clearPeriodForm()">Clear</button>
</div>

<div id="periodInfo" class="summary-box"></div>
</div>

<!-- DASHBOARD -->
<div class="card">
<h2>📊 Dashboard</h2>

<div class="dashboard">

<div class="stat">
<span>🚗 Vehicles</span>
<strong id="totalVehicles">0</strong>
</div>

<div class="stat">
<span>💰 Budget</span>
<strong id="totalBudget">0.00</strong>
</div>

<div class="stat">
<span>⛽ Fuel</span>
<strong id="totalLiters">0.00 L</strong>
</div>

<div class="stat">
<span>💵 Expense</span>
<strong id="totalExpense">0.00</strong>
</div>

<div class="stat">
<span>🛣️ KM</span>
<strong id="totalKM">0.00</strong>
</div>

<div class="stat">
<span>💳 Remaining</span>
<strong id="totalRemaining">0.00</strong>
</div>

</div>
</div>

<!-- VEHICLE -->
<div class="card no-print">
<h2>🚗 Vehicle Management</h2>

<div class="grid">

<div>
<label>Plate Number</label>
<input id="vehiclePlate" placeholder="Example: ET-12345">
</div>

<div>
<label>Driver Name</label>
<input id="vehicleDriver" placeholder="Driver name">
</div>

</div>

<div class="actions">
<button onclick="saveVehicle()">Save / Update Vehicle</button>
<button class="btn-gray" onclick="clearVehicleForm()">Clear</button>
</div>

<div id="vehicleList"></div>
</div>

<!-- BUDGET -->
<div class="card no-print">
<h2>💰 Vehicle 15-Day Budget</h2>

<div class="grid">

<div>
<label>Vehicle</label>
<select id="budgetPlate"></select>
</div>

<div>
<label>Budget Amount</label>
<input type="number" id="budgetAmount" min="0" step="0.01">
</div>

</div>

<div class="actions">
<button onclick="saveBudget()">Save Budget</button>
<button class="btn-gray" onclick="clearBudgetForm()">Clear</button>
</div>
</div>

<!-- FUEL ENTRY -->
<div class="card no-print">
<h2>⛽ Fuel Entry</h2>

<div class="grid3">

<div>
<label>Vehicle</label>
<select id="fuelPlate"></select>
</div>

<div>
<label>Driver</label>
<input id="fuelDriver">
</div>

<div>
<label>Date</label>
<input type="date" id="fuelDate">
</div>

<div>
<label>Time</label>
<input
