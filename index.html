<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>15-Day Fuel & KM Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f0f2f5;
 color:#1c1e21
}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.container{max-width:1100px;margin:auto;padding:15px}
.card{
 background:white;
 border-radius:12px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 2px 8px #00000012
}
h1,h2,h3{margin-top:0}
.header{
 background:#1877f2;
 color:white;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 8px #0003
}
.header-inner{
 max-width:1100px;
 margin:auto;
 padding:14px 15px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px
}
.logo{font-size:20px;font-weight:bold}
.userbox{font-size:13px;text-align:right}
.btn{
 padding:10px 14px;
 border-radius:8px;
 background:#1877f2;
 color:white;
 font-weight:bold;
 margin:3px
}
.btn.secondary{background:#65676b}
.btn.green{background:#168c45}
.btn.red{background:#d93025}
.btn.orange{background:#f57c00}
.btn.light{background:#e4e6eb;color:#111}
.btn:disabled{opacity:.5;cursor:not-allowed}

.login-page{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px
}
.login-card{
 width:100%;
 max-width:430px;
 background:white;
 padding:30px;
 border-radius:16px;
 box-shadow:0 5px 25px #0002
}
.login-logo{
 text-align:center;
 font-size:30px;
 font-weight:bold;
 color:#1877f2;
 margin-bottom:20px
}

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}
.field label{
 display:block;
 font-weight:bold;
 font-size:13px;
 margin-bottom:5px
}
.field input,.field select{
 width:100%;
 padding:11px;
 border:1px solid #ccd0d5;
 border-radius:8px;
 background:white
}
.full{grid-column:1/-1}

.stats{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:10px
}
.stat{
 background:#f7f8fa;
 padding:14px;
 border-radius:10px;
 text-align:center
}
.stat strong{display:block;font-size:20px;color:#1877f2}
.stat span{font-size:12px;color:#65676b}

.nav{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-bottom:15px
}
.nav button{background:white;color:#333}
.nav button.active{background:#1877f2;color:white}

.page{display:none}
.page.active{display:block}

table{
 width:100%;
 border-collapse:collapse;
 font-size:13px
}
th,td{
 padding:9px;
 border-bottom:1px solid #ddd;
 text-align:left;
 white-space:nowrap
}
th{background:#f0f2f5}
.table-wrap{overflow-x:auto}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold
}
.badge.admin{background:#e8f0fe;color:#174ea6}
.badge.staff{background:#e6f4ea;color:#137333}
.badge.viewer{background:#f1f3f4;color:#5f6368}

.alert{
 padding:12px;
 border-radius:8px;
 margin-bottom:12px;
 background:#fff3cd
}
.success{background:#d1e7dd}
.error{background:#f8d7da;color:#842029}

.hidden{display:none!important}
.muted{color:#65676b;font-size:13px}
.big{font-size:25px;font-weight:bold}
.right{text-align:right}
.center{text-align:center}

.report-head{
 text-align:center;
 padding:15px;
 border-bottom:2px solid #222;
 margin-bottom:15px
}

@media(max-width:800px){
 .stats{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .stats{grid-template-columns:repeat(2,1fr)}
 .header-inner{align-items:flex-start}
 .userbox{font-size:11px}
 .container{padding:9px}
 .card{padding:13px}
 th,td{font-size:11px;padding:7px}
}

@media print{
 .no-print{display:none!important}
 body{background:white}
 .card{box-shadow:none;border:1px solid #ddd}
 .page{display:none!important}
 #officialPage{display:block!important}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
 <div class="login-card">
   <div class="login-logo">Fuel & KM Manager</div>
   <h2 class="center">15-Day Fuel Management</h2>
   <p class="muted center">Sign in to continue</p>

   <div id="loginMessage"></div>

   <div class="field">
     <label>Email</label>
     <input id="loginEmail" type="email" placeholder="your@email.com">
   </div>

   <br>

   <div class="field">
     <label>Password</label>
     <input id="loginPassword" type="password" placeholder="Password">
   </div>

   <br>

   <button class="btn" style="width:100%" onclick="login()">
     Login
   </button>

   <button class="btn light" style="width:100%" onclick="signup()">
     Create Account
   </button>

   <p class="muted center">
     Your account is protected by Supabase Authentication.
   </p>
 </div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<header class="header no-print">
 <div class="header-inner">
   <div class="logo">⛽ Fuel & KM Manager</div>

   <div class="userbox">
     <div id="userEmail"></div>
     <div id="userRole"></div>
     <button class="btn light" onclick="logout()">Logout</button>
   </div>
 </div>
</header>

<div class="container">

 <div class="nav no-print">
   <button class="btn light active" onclick="showPage('dashboard',this)">Dashboard</button>
   <button class="btn light" onclick="showPage('vehicles',this)">Vehicles</button>
   <button class="btn light" onclick="showPage('fuel',this)">Fuel Entry</button>
   <button class="btn light" onclick="showPage('history',this)">History</button>
   <button class="btn light" onclick="showPage('reports',this)">Reports</button>
   <button class="btn light" onclick="showPage('officialPage',this)">Official Report</button>
   <button class="btn light" onclick="showPage('settings',this
